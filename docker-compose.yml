services:
  # ===========================================
  # BASE DE DATOS PRINCIPAL (PostgreSQL + PostGIS)
  # ===========================================
  database:
    image: postgis/postgis:17-3.5
    container_name: bomberos-pern-database
    environment:
      POSTGRES_DB: ${DB_NAME:-db_bomberos}
      POSTGRES_USER: ${DB_USERNAME:-user_bomberos}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password_bomberos}
      POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=es-ES --encoding=UTF8"
      # Zona horaria de Chile (maneja automáticamente el cambio de horario)
      TZ: America/Santiago
      PGTZ: America/Santiago
    ports:
      - "${EXTERNAL_DB_PORT:-5432}:5432"
    volumes:
      - database_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-user_bomberos} -d ${DB_NAME:-db_bomberos}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - network

  # ===========================================
  # CACHE Y NOTIFICACIONES (Redis)
  # ===========================================
  redis:
    image: redis:7-alpine
    container_name: bomberos-pern-redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    ports:
      - "${EXTERNAL_REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - network
    command: redis-server --appendonly yes ${REDIS_PASSWORD:+--requirepass $REDIS_PASSWORD}

  # ===========================================
  # ALMACENAMIENTO DE ARCHIVOS (MinIO)
  # ===========================================
  minio:
    image: minio/minio:latest
    container_name: bomberos-pern-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin123}
    ports:
      - "${EXTERNAL_MINIO_PORT:-9000}:9000"
      - "${EXTERNAL_MINIO_CONSOLE_PORT:-9002}:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 30s
    networks:
      - network
# ===========================================
# VOLÚMENES PERSISTENTES
# ===========================================
volumes:
  database_data:
    driver: local
  database_test_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local

# ===========================================
# REDES
# ===========================================
networks:
  network:
    driver: bridge
    name: bomberos-pern-network